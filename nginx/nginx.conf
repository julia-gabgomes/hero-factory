worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;

  resolver 127.0.0.11 valid=10s;

  upstream api {
    zone api 64k;
    server api1:3000 resolve;
    server api2:3000 resolve;
    keepalive 32;
  }

  server {
    listen 80;

    # Barra final em ambos: o Nginx troca o prefixo /api/ por / antes de
    # repassar, porque a API registra as rotas sem esse prefixo (/heroes,
    # /missions). Sem isso, /api/heroes seria repassado como /api/heroes
    # para o upstream, que não tem essa rota.
    location /api/ {
      proxy_pass http://api/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;
    }
  }
}
