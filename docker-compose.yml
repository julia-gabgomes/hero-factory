name: hero-factory

services:
  mysql:
    image: mysql:8.4
    command:
      - --collation-server=utf8mb4_0900_ai_ci
      - --character-set-server=utf8mb4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hero_factory}
      MYSQL_USER: ${MYSQL_USER:-hero_factory}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hero_factory}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-root}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Roda as migrations e, se SEED_ON_START=true, o seed de 100k heróis
  # (idempotente), depois sai. api1/api2 só sobem quando este serviço
  # termina com sucesso.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-hero_factory}:${MYSQL_PASSWORD:-hero_factory}@mysql:3306/${MYSQL_DATABASE:-hero_factory}
      SEED_ON_START: ${SEED_ON_START:-false}
    command:
      - sh
      - -c
      - |
        pnpm run db:migrate &&
        if [ "$$SEED_ON_START" = "true" ]; then pnpm run db:seed; fi
    depends_on:
      mysql:
        condition: service_healthy

  api1:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["pnpm", "exec", "tsx", "src/server.ts"]
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-hero_factory}:${MYSQL_PASSWORD:-hero_factory}@mysql:3306/${MYSQL_DATABASE:-hero_factory}
      PORT: "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  api2:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["pnpm", "exec", "tsx", "src/server.ts"]
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-hero_factory}:${MYSQL_PASSWORD:-hero_factory}@mysql:3306/${MYSQL_DATABASE:-hero_factory}
      PORT: "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Placeholder: só ganha lógica real (processar import_jobs do CSV) quando
  # a importação (opcional 2) for implementada. Até lá, não há nada que ele
  # precise fazer.
  worker:
    image: node:${NODE_VERSION:-24}
    command: ["tail", "-f", "/dev/null"]
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      api1:
        condition: service_started
      api2:
        condition: service_started

  k6:
    image: grafana/k6
    profiles: ["bench"]
    environment:
      BASE_URL: http://nginx
    volumes:
      - ./bench:/scripts:ro
    command: ["run", "/scripts/heroes.js"]
    depends_on:
      nginx:
        condition: service_started

volumes:
  mysql_data:
